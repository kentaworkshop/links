<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="SPYAIR Dr. KENTA — 公式・SNS へのリンクです。"
    />
    <title>KENTA — Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: "Zen Kaku Gothic New", system-ui, -apple-system, "Hiragino Sans",
          "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        min-height: 100vh;
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.06),
          0 4px 16px rgba(0, 0, 0, 0.04),
          inset 0 1px 0 rgba(255, 255, 255, 0.7);
      }

      .glass-link {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        transition:
          background 0.3s ease,
          border-color 0.3s ease,
          box-shadow 0.3s ease,
          transform 0.3s ease;
      }

      .glass-link:hover {
        background: rgba(255, 255, 255, 0.9);
        border-color: rgba(255, 255, 255, 0.6);
        box-shadow:
          0 12px 40px rgba(0, 0, 0, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.8);
        transform: translateY(-2px);
      }

      .glass-link:focus-visible {
        outline: 2px solid #475569;
        outline-offset: 3px;
      }

      .luxury-title {
        font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
        background: linear-gradient(135deg, #1e293b, #475569);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }

      @supports not (-webkit-background-clip: text) {
        .luxury-title {
          color: #1e293b;
          -webkit-text-fill-color: unset;
          background: none;
        }
      }

      .fade-in {
        animation: fadeInUp 0.8s ease-out forwards;
        opacity: 0;
        transform: translateY(20px);
      }

      .fade-in-delay-1 {
        animation-delay: 0.2s;
      }
      .fade-in-delay-2 {
        animation-delay: 0.4s;
      }

      @keyframes fadeInUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .fade-in {
          animation: none;
          opacity: 1;
          transform: none;
        }
        .glass-link {
          transition: none;
        }
        .glass-link:hover {
          transform: none;
        }
      }

      .category-divider {
        background: linear-gradient(
          90deg,
          transparent,
          rgba(148, 163, 184, 0.35),
          transparent
        );
        height: 1px;
      }

      .link-icon {
        width: 22px;
        height: 22px;
        opacity: 0.65;
        flex-shrink: 0;
        transition: opacity 0.3s ease;
      }

      .glass-link:hover .link-icon {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>

                  <svg

                    <svg

        <footer class="text-center mt-14 fade-in fade-in-delay-2">

</html>
